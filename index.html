<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>두구두구 뽑기 🎲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff4fb; --bg2:#eef6ff; --bg3:#fffaec;
  --ink:#3d3550; --sub:#8a83a0; --line:#ece7f6; --card:#fff;
  --grape:#8b6fd6; --grape-d:#6f55b8;
  --pink:#ff8fb1; --pink-d:#ef6f97;
  --mint:#5ecfb0; --sun:#ffc861; --sky:#6fc3f0;
  --shadow:0 5px 0 rgba(0,0,0,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0; font-family:'Jua',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
  color:var(--ink); background:linear-gradient(155deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed; padding-bottom:40px; overflow-x:hidden}
button{font-family:inherit; color:inherit; cursor:pointer; border:none; background:none}
.spacer{flex:1}

/* ── ✨ 주인공 스포트라이트 (뽑힌 친구) ── */
.spot{position:fixed; inset:0; z-index:90; display:none; flex-direction:column; align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 46%, #3a2a6e 0%, #1c1438 62%, #120c26 100%); overflow:hidden; cursor:pointer}
.spot.on{display:flex}
.spot .rays{position:absolute; left:50%; top:46%; width:220vmax; height:220vmax; margin:-110vmax 0 0 -110vmax;
  background:repeating-conic-gradient(rgba(255,226,140,.16) 0 9deg, transparent 9deg 22deg);
  animation:spin 18s linear infinite; pointer-events:none}
.spot .glow{position:absolute; left:50%; top:46%; width:80vmin; height:80vmin; margin:-40vmin 0 0 -40vmin; border-radius:50%;
  background:radial-gradient(circle, rgba(255,236,170,.55), rgba(255,200,97,.18) 45%, transparent 70%);
  animation:breathe 2.2s ease-in-out infinite; pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(.92);opacity:.85}50%{transform:scale(1.06);opacity:1}}
.spot .inner{position:relative; z-index:2; text-align:center; padding:0 4vw; max-width:100%}
.spot .cap{color:#ffe6a3; font-size:clamp(24px,5vh,56px); letter-spacing:.04em; text-shadow:0 3px 0 rgba(0,0,0,.25);
  opacity:0; animation:fadeup .6s .15s ease-out forwards}
.spot .crown{font-size:clamp(60px,14vh,150px); line-height:1; display:inline-block; margin-top:1vh;
  animation:crown 1s .25s cubic-bezier(.2,1.6,.4,1) both, wob 2.4s 1.3s ease-in-out infinite}
.spot .who{display:flex; flex-wrap:wrap; gap:2vh 3vw; justify-content:center; margin-top:1vh}
.spot .nm{display:inline-block; color:#fff; font-size:clamp(56px,17vh,200px); line-height:1.1; white-space:nowrap;
  text-shadow:0 0 18px rgba(255,214,120,.9), 0 0 50px rgba(255,170,90,.55), 0 6px 0 rgba(0,0,0,.25);
  animation:zoomin .75s cubic-bezier(.2,1.5,.35,1) both}
.spot.many .nm{font-size:clamp(34px,var(--fs,11vh),150px); background:rgba(255,255,255,.1); border:3px solid rgba(255,226,140,.7);
  border-radius:28px; padding:.08em .45em}
.spot .msg{color:#fff; font-size:clamp(20px,4.2vh,46px); margin-top:2.4vh; opacity:0; animation:fadeup .6s 1s ease-out forwards}
.spot .tap{position:absolute; bottom:3vh; left:0; right:0; text-align:center; color:rgba(255,255,255,.55); font-size:clamp(14px,2vh,22px); z-index:2}
.spot .star{position:absolute; z-index:1; pointer-events:none; animation:twinkle var(--d,2s) var(--dl,0s) ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.3) rotate(0);opacity:0}50%{transform:scale(1) rotate(40deg);opacity:1}}
@keyframes zoomin{0%{transform:scale(.1) rotate(-8deg);opacity:0}70%{transform:scale(1.12) rotate(2deg);opacity:1}100%{transform:scale(1)}}
@keyframes crown{0%{transform:translateY(-60vh) rotate(-30deg)}100%{transform:translateY(0) rotate(0)}}
@keyframes wob{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.spot .conf2{position:absolute; inset:0; pointer-events:none; z-index:3}
.spot .conf2 i{position:absolute; top:-20px; width:12px; height:18px; border-radius:3px; animation:drop linear forwards}
@keyframes drop{to{transform:translateY(110vh) rotate(720deg)}}
.btn{border:2px solid var(--line); background:#fff; border-radius:18px; padding:.6em 1.1em;
  font-size:clamp(15px,2vh,21px); box-shadow:var(--shadow)}
.btn:active{transform:translateY(2px); box-shadow:0 3px 0 rgba(0,0,0,.09)}
.btn.primary{background:var(--grape); border-color:var(--grape-d); color:#fff}
.btn.pink{background:var(--pink); border-color:var(--pink-d); color:#fff}
.btn.mini{padding:.42em .75em; font-size:clamp(13px,1.7vh,17px); border-radius:14px}
.btn.danger{color:#d9534f}
.btn[disabled]{opacity:.45; pointer-events:none}

/* ── 배경 손그림 ── */
.deco{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
.deco span{position:absolute; font-size:clamp(26px,5vw,52px); opacity:.35; animation:floaty 7s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-12px) rotate(calc(var(--r,0deg) + 6deg))}}
.wrap{position:relative; z-index:1}

header{display:flex; align-items:center; gap:10px; padding:14px 16px 2px; flex-wrap:wrap}
.htitle{font-size:clamp(21px,3vh,30px)}
.htitle small{display:block; font-size:.52em; color:var(--sub)}

/* ── 모드 탭 ── */
.tabs{display:flex; gap:8px; overflow-x:auto; padding:10px 16px 4px; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto; border:2px solid var(--line); background:#fff; border-radius:18px;
  padding:.5em .95em; font-size:clamp(15px,2vh,20px); color:var(--sub); box-shadow:0 3px 0 rgba(0,0,0,.06)}
.tab.on{background:var(--grape); border-color:var(--grape-d); color:#fff}

/* ── 무대 ── */
.stage{max-width:760px; margin:10px auto 0; padding:0 16px}
.board{background:#fff; border:4px solid var(--line); border-radius:30px; padding:18px 16px 22px;
  box-shadow:0 8px 0 rgba(0,0,0,.07); position:relative; overflow:hidden; min-height:34vh;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px}
.mascot{font-size:clamp(34px,7vh,64px); line-height:1}
.mascot.roll{animation:hop .5s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
.bigname{font-size:clamp(34px,9vh,86px); line-height:1.1; text-align:center; word-break:keep-all;
  color:var(--grape-d); min-height:1.2em}
.bigname.roll{color:var(--sub); opacity:.75}
.sayline{color:var(--sub); font-size:clamp(14px,2vh,19px); text-align:center}
.ctl{display:flex; gap:9px; flex-wrap:wrap; justify-content:center; margin-top:6px}
.numrow{display:flex; align-items:center; gap:8px; font-size:clamp(15px,2vh,19px); flex-wrap:wrap; justify-content:center}
.num{display:flex; align-items:center; gap:6px; border:2px solid var(--line); border-radius:16px; padding:.2em .3em; background:#fff}
.num button{width:2em; font-size:1.1em; color:var(--grape-d)}
.num b{min-width:2.2em; text-align:center}

/* 결과 카드들 */
.cards{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; width:100%}
.gcard{border:3px solid var(--line); border-radius:22px; padding:10px 12px 12px; background:#fdfcff;
  min-width:140px; flex:1 1 170px; max-width:230px; box-shadow:0 4px 0 rgba(0,0,0,.06)}
.gcard h4{margin:.1em 0 .4em; font-size:clamp(16px,2.2vh,21px); display:flex; align-items:center; gap:6px}
.gcard ul{margin:0; padding-left:1.1em; font-size:clamp(15px,2.1vh,20px); line-height:1.55}
.gcard.c0{border-color:#ffc0d4} .gcard.c1{border-color:#bfe3ff} .gcard.c2{border-color:#c9f0dd}
.gcard.c3{border-color:#ffe3a8} .gcard.c4{border-color:#dcd0ff} .gcard.c5{border-color:#ffd2b8}
.pairline{display:flex; align-items:center; gap:8px; justify-content:center; font-size:clamp(17px,2.6vh,26px);
  border:3px solid var(--line); border-radius:20px; padding:.45em .8em; background:#fff; box-shadow:0 4px 0 rgba(0,0,0,.06)}
.orderlist{width:100%; display:flex; flex-direction:column; gap:7px}
.oitem{display:flex; align-items:center; gap:10px; border:2px solid var(--line); border-radius:16px;
  padding:.4em .7em; background:#fff; font-size:clamp(16px,2.3vh,22px)}
.oitem .no{background:var(--grape); color:#fff; border-radius:50%; width:1.7em; height:1.7em;
  display:flex; align-items:center; justify-content:center; font-size:.85em; flex:0 0 auto}
.picked{display:flex; flex-wrap:wrap; gap:7px; justify-content:center}
.ptag{border:2px solid var(--pink); background:#fff2f7; border-radius:14px; padding:.3em .6em;
  font-size:clamp(15px,2vh,20px)}

/* ── 모둠 뽑기 ── */
.gpgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; width:100%; margin-top:6px}
.gpc{border:4px solid var(--line); border-radius:24px; background:#fff; padding:14px 8px; text-align:center; position:relative;
  box-shadow:0 5px 0 rgba(0,0,0,.07); transition:transform .08s}
.gpc .ic{display:block; font-size:clamp(34px,6vh,58px); line-height:1.1}
.gpc b{font-size:clamp(20px,3.2vh,32px)}
.gpc i{position:absolute; top:6px; right:10px; font-style:normal; font-size:13px; color:var(--pink-d)}
.gpc.c0{border-color:#ffc0d4} .gpc.c1{border-color:#bfe3ff} .gpc.c2{border-color:#c9f0dd}
.gpc.c3{border-color:#ffe3a8} .gpc.c4{border-color:#dcd0ff} .gpc.c5{border-color:#ffd2b8}
.gpc.done{opacity:.35; filter:grayscale(.7)}
.gpc.lit{transform:scale(1.08); background:#fff6cc; border-color:var(--sun); box-shadow:0 0 0 5px #ffe58a, 0 8px 0 rgba(0,0,0,.08)}
.gpc.win{animation:gwin .8s cubic-bezier(.2,1.6,.4,1); background:#fff2b3}
@keyframes gwin{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-4deg)}100%{transform:scale(1.08)}}

/* ── 사다리 ── */
body.wide .stage{max-width:1400px}
body.wide .board .mascot{display:none}
body.wide .bigname{font-size:clamp(24px,5.5vh,56px)}
body.wide .ladarea .lmid{height:max(260px,calc(100vh - 470px))}
.ladform{width:100%; display:flex; flex-direction:column; gap:8px}
.lf{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.lf .lt{font-size:clamp(15px,2vh,20px); color:var(--grape-d); min-width:6.5em}
.lf input{flex:1; min-width:260px; font-family:inherit; font-size:clamp(15px,2vh,20px); border:2px solid var(--line); border-radius:14px; padding:.45em .7em; color:var(--ink)}
.lp{display:flex; gap:6px; flex-wrap:wrap}
.ladarea{width:100%; margin-top:8px; --n:4}
.lrow{display:grid; grid-template-columns:repeat(var(--n),1fr); gap:6px}
.ltop{border:3px solid var(--lc); background:#fff; border-radius:16px; padding:.4em .2em; font-size:clamp(14px,min(2.4vh,calc(13vw / var(--n))),24px);
  box-shadow:0 4px 0 var(--lc); line-height:1.2; word-break:keep-all; display:flex; flex-direction:column; align-items:center}
.ltop:hover{transform:translateY(-2px)}
.ltop.go{background:var(--lc); color:#fff; animation:hop .5s ease-in-out infinite}
.ltop.did{opacity:.75}
.ltop small{font-size:.7em; color:var(--sub)}
.ltop .la:empty{display:none}
.lmid{position:relative; height:44vh; min-height:260px; margin:6px 0}
.ladsvg{position:absolute; inset:0; width:100%; height:100%}
.ladsvg .lv{stroke:#d9d0ea; stroke-width:7; stroke-linecap:round; vector-effect:non-scaling-stroke}
.ladsvg .lr{stroke:#d9d0ea; stroke-width:6; stroke-linecap:round; vector-effect:non-scaling-stroke}
.ladsvg .lt{fill:none; stroke-width:9; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; filter:drop-shadow(0 0 4px rgba(255,255,255,.9))}
.ladarea.tracing .ladsvg .lt{opacity:.35}
.ladarea.tracing .ladsvg .lt:last-child{opacity:1}
.lball{position:absolute; width:26px; height:26px; margin:-13px 0 0 -13px; border-radius:50%; border:4px solid #fff; box-shadow:0 0 0 3px rgba(0,0,0,.08),0 0 18px rgba(255,200,80,.9); opacity:0; pointer-events:none; z-index:2}
.lball.on{opacity:1}
.lbot{position:relative; height:clamp(54px,8vh,84px); perspective:600px}
.lbot .q,.lbot .r{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:16px; backface-visibility:hidden; transition:transform .6s cubic-bezier(.3,1.5,.5,1); text-align:center; padding:0 .2em; word-break:keep-all; line-height:1.15}
.lbot .q{background:repeating-linear-gradient(45deg,#b9a7ea 0 10px,#a993e3 10px 20px); color:#fff; font-size:clamp(24px,4vh,40px); box-shadow:0 4px 0 #8b6fd6}
.lbot .r{background:#fff7d6; border:3px solid var(--lc,#ffc861); transform:rotateY(180deg); font-size:clamp(13px,min(2.4vh,calc(12vw / var(--n))),24px); box-shadow:0 4px 0 var(--lc,#ffc861)}
.lbot.open .q{transform:rotateY(-180deg)}
.lbot.open .r{transform:rotateY(0)}
.lbot.open:not(.lose) .r{animation:gwin .8s .3s}
.lbot.lose .r{background:#f3f1f8; color:var(--sub)}

/* 색종이 */
.confetti{position:absolute; inset:0; pointer-events:none; overflow:hidden}
.confetti i{position:absolute; width:9px; height:14px; border-radius:2px; animation:fall linear forwards}
@keyframes fall{from{transform:translateY(-20px) rotate(0)}to{transform:translateY(120%) rotate(540deg)}}

/* ── 명단 ── */
.pool{max-width:760px; margin:16px auto 0; padding:0 16px}
.pool h3{font-size:clamp(16px,2.1vh,21px); margin:.2em 0 .4em; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.hint{color:var(--sub); font-size:clamp(13px,1.8vh,17px); margin:.3em 0}
/* 이름 길이(2~4글자)가 달라도 칸 너비를 똑같이 → 줄이 딱 맞는다 */
.chips{display:grid; grid-template-columns:repeat(auto-fill,minmax(6.6em,1fr)); gap:7px; font-size:clamp(14px,1.9vh,19px)}
.chip{border:2px solid var(--line); background:#fff; border-radius:15px; padding:.38em .5em; text-align:center;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;
  font-size:inherit; box-shadow:0 3px 0 rgba(0,0,0,.06)}
.chip.off{background:#f3f1f8; color:#b9b3c8; text-decoration:line-through; box-shadow:none}
.chip.done{border-color:var(--pink); background:#fff4f8}

/* ── 설정 ── */
.modal{position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center;
  padding:16px; background:rgba(60,50,80,.35); backdrop-filter:blur(3px)}
.modal.on{display:flex}
.sheet{width:min(560px,100%); max-height:88vh; overflow:auto; background:#fff; border-radius:26px;
  border:3px solid var(--line); box-shadow:0 10px 0 rgba(0,0,0,.10); padding:18px}
.sheet h3{margin:.1em 0 .5em; font-size:clamp(19px,2.6vh,26px)}
label.f{display:block; margin:.9em 0 .3em; font-size:clamp(15px,1.9vh,19px)}
textarea{width:100%; min-height:30vh; font-family:inherit; font-size:clamp(16px,2vh,20px); line-height:1.55;
  border:2px solid var(--line); border-radius:14px; padding:.6em .75em; background:#fdfcff; color:var(--ink); resize:vertical}
.frow{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
.sheet>.frow.foot{position:sticky; bottom:-18px; z-index:5; margin-top:16px; padding:12px 0 18px;
  background:#fff; border-top:2px dashed var(--line)}
.toggle{display:flex; align-items:center; gap:10px; margin-top:1em; font-size:clamp(15px,1.9vh,19px); cursor:pointer}
.sw{width:52px; height:30px; border-radius:99px; background:#ddd6ee; position:relative; flex:0 0 auto; transition:background .18s}
.sw i{position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25); transition:left .18s}
.sw.on{background:var(--mint)} .sw.on i{left:25px}

@media print{
  @page{size:A4 portrait; margin:14mm}
  body{background:#fff}
  .noprint,.deco{display:none !important}
  .board{border-color:#bbb; box-shadow:none; min-height:0}
  .gcard{box-shadow:none; border-color:#999; background:#fff}
  .oitem{box-shadow:none}
  .oitem .no{background:#666}
}
</style>
</head>
<body>
<div class="deco" id="deco"></div>
<div class="wrap">

<header class="noprint">
  <div class="htitle">🎲 두구두구 뽑기<small id="hsub">우리 반 랜덤 뽑기</small></div>
  <div class="spacer"></div>
  <button class="btn mini" id="btnSound" title="소리 켜기/끄기">🔊</button>
  <button class="btn mini" id="btnSet">⚙️ 명단</button>
</header>

<div class="tabs noprint" id="tabs"></div>

<div class="stage">
  <div class="board" id="board">
    <div class="confetti" id="conf"></div>
  </div>
</div>

<div class="pool noprint" id="pool"></div>

<div class="modal" id="mSet">
  <div class="sheet">
    <h3>⚙️ 우리 반 명단</h3>
    <p class="hint">엑셀·한글에서 이름을 <b>복사해서 그대로 붙여넣으세요.</b><br>
      줄바꿈·쉼표·번호(1. 김민준)가 섞여 있어도 알아서 정리합니다.</p>
    <textarea id="inRoster" placeholder="김민준&#10;이서연&#10;박도윤&#10;…"></textarea>
    <p class="hint" id="cnt">0명</p>

    <div class="toggle" id="tgNoRepeat">
      <div class="sw"><i></i></div>
      <div>한 명·여러 명 뽑기에서 <b>오늘 뽑힌 친구는 다시 안 뽑기</b></div>
    </div>
    <div class="toggle" id="tgAnimal">
      <div class="sw"><i></i></div>
      <div>이름 옆에 <b>동물 친구</b> 보여주기 🐻</div>
    </div>
    <div class="toggle" id="tgSound">
      <div class="sw"><i></i></div>
      <div>두구두구 <b>소리</b> 켜기 🥁</div>
    </div>
    <label class="f">소리 크기</label>
    <div class="frow" id="volRow" style="margin-top:.2em"></div>

    <div class="frow foot">
      <button class="btn danger mini" id="btnWipe">전체 지우기</button>
      <div class="spacer"></div>
      <button class="btn" id="btnCancel">취소</button>
      <button class="btn primary" id="btnSave">저장</button>
    </div>
  </div>
</div>
</div>

<div class="spot" id="spot"><div class="rays"></div><div class="glow"></div><div class="conf2" id="spotConf"></div>
  <div class="inner"><div class="cap" id="spotCap"></div><div class="crown">👑</div>
    <div class="who" id="spotWho"></div><div class="msg" id="spotMsg"></div></div>
  <div class="tap">화면을 누르면 닫혀요</div></div>
<script>
const KEY='pick_v1';
const $=s=>document.querySelector(s);
const ANIMALS=['🐻','🐰','🐥','🐱','🐼','🦊','🐨','🐸','🐯','🐶','🐷','🐵','🦁','🐮','🐔','🦄','🐧','🐢','🐙','🦉','🐝','🦋','🐬','🐳','🦔','🐹','🦒','🐴','🦘'];
const GROUPICON=['🍓','🍋','🍇','🍑','🍏','🍊','🫐','🍉','🥝','🍒'];
const MODES=[
  {id:'one',  t:'🎯 한 명 뽑기'},
  {id:'many', t:'✨ 여러 명 뽑기'},
  {id:'pair', t:'👫 짝 만들기'},
  {id:'group',t:'🧩 모둠 나누기'},
  {id:'order',t:'🔢 순서 정하기'},
  {id:'gpick',t:'🍀 모둠 뽑기'},
  {id:'ladder',t:'🪜 사다리 타기'}
];

let S=normalize(load());
let rolling=false;

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function normalize(o){
  const s=Object.assign({roster:'', mode:'one', noRepeat:true, animal:true,
    off:{}, done:{}, pickN:3, groupN:4, groupBy:'count', oddMode:'trio', sound:true, vol:'mid', gpN:6, gpNoRep:true, gpDone:{}, ladTop:'', ladBot:''},o||{});
  s.off=s.off||{}; s.done=s.done||{}; s.gpDone=s.gpDone||{};
  /* 날짜가 바뀌면 「오늘 뽑힌 친구」와 「오늘 결석」은 새로 시작 */
  if(s.day!==todayKey()){ s.done={}; s.off={}; s.gpDone={}; s.day=todayKey(); }
  return s;
}
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
/* 수업 중에 자정이 지나도(밤새 켜 둔 화면) 다음 뽑기 전에 맞춘다 */
function dayCheck(){ if(S.day!==todayKey()){ S.done={}; S.off={}; S.gpDone={}; S.day=todayKey(); save(); drawPool(); return true; } return false; }

function names(){
  return S.roster.split(/[\n,\t]+/).map(t=>t.trim())
    .map(t=>t.replace(/^\(?\d+\)?[.)\]]?\s*/,'').trim()).filter(Boolean);
}
const alive=()=>names().filter(n=>!S.off[n]);
const ani=n=>{ const l=names(); const i=l.indexOf(n); return S.animal? (ANIMALS[(i<0?0:i)%ANIMALS.length]+' ') : ''; };
/* ══ 소리 (파일 없이 그때그때 만들어 냄) ══ */
let AC=null, MG=null;
const VOLS={low:.6, mid:1.25, high:2.1};
function setVol(){ if(MG) MG.gain.value=VOLS[S.vol]||VOLS.mid; }
function out(){ return MG||(AC?AC.destination:null); }
function ac(){
  if(!S.sound) return null;
  try{
    if(!AC){
      AC=new (window.AudioContext||window.webkitAudioContext)();
      MG=AC.createGain(); MG.gain.value=VOLS[S.vol]||VOLS.mid; MG.connect(AC.destination);
    }
    if(AC.state==='suspended') AC.resume();
    if(MG) MG.gain.value=VOLS[S.vol]||VOLS.mid;      // 소리 낼 때마다 지금 크기로 맞춤
  }catch(e){ return null; }
  return AC;
}
function tone(freq,dur,type,vol,delay,slideTo){
  const c=ac(); if(!c) return;
  const t0=c.currentTime+(delay||0);
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'triangle'; o.frequency.setValueAtTime(freq,t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||.22,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(out()); o.start(t0); o.stop(t0+dur+0.02);
}
function drumTap(vol){
  const c=ac(); if(!c) return;
  const t0=c.currentTime, len=Math.floor(c.sampleRate*0.06);
  const buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);
  const src=c.createBufferSource(); src.buffer=buf;
  const hp=c.createBiquadFilter(); hp.type='bandpass'; hp.frequency.value=1800; hp.Q.value=.8;
  const g=c.createGain(); g.gain.value=vol||.3;
  src.connect(hp).connect(g).connect(out()); src.start(t0);
}
/* 두구두구 — 드럼 + 계단처럼 올라가는 장난기 있는 가락 */
const SCALE=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.51];   // 도레미솔라 5음계
let rollStep=0;
function sfxRoll(p){
  drumTap(.2+p*.22);
  const up=Math.min(SCALE.length-1, Math.floor(p*SCALE.length));
  const n=SCALE[(rollStep++)%3===0? up : Math.max(0,up-2)];
  tone(n,.07,'square',.14);
  if(p>.72) tone(n/2,.10,'triangle',.12,.01);    // 마지막엔 낮은 음을 겹쳐 두근두근
}
/* 짜잔! */
function sfxWin(){
  const c=ac(); if(!c) return;
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,.24,'triangle',.32,i*0.085));
  tone(1567.98,.5,'sine',.22,.34);
  drumTap(.38);
}
/* 카드가 하나씩 나올 때 */
function sfxPop(i){ tone(520+((i||0)%6)*70,.09,'sine',.2); }

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(t){ return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  MODES.forEach(m=>{
    const b=document.createElement('button');
    b.className='tab'+(S.mode===m.id?' on':''); b.textContent=m.t;

/* ── 무대 ── */
function drawBoard(html){
  const b=$('#board');
  b.innerHTML='<div class="confetti" id="conf"></div>';
  const box=document.createElement('div');
  box.style.cssText='display:flex;flex-direction:column;align-items:center;gap:10px;width:100%';
  b.appendChild(box);
  if(html){ box.innerHTML=html; return box; }
  const list=alive();
  document.body.classList.toggle('wide',S.mode==='ladder');
  if(S.mode==='gpick'){ boardGpick(box); return box; }
  if(S.mode==='ladder'){ boardLadder(box,list); return box; }
  if(names().length<1){
    box.innerHTML='<div class="mascot">🐣</div><div class="sayline">먼저 <b>⚙️ 명단</b> 에서 우리 반 이름을 붙여넣어 주세요!</div>';
    return box;
  }
  if(S.mode==='one')   boardOne(box,list);
  if(S.mode==='many')  boardMany(box,list);
  if(S.mode==='pair')  boardPair(box,list);
  if(S.mode==='group') boardGroup(box,list);
  if(S.mode==='order') boardOrder(box,list);
  return box;
}
function el(tag,cls,html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e; }
function ctl(box,items){ const c=el('div','ctl'); items.forEach(b=>c.appendChild(b)); box.appendChild(c); return c; }
function freshBtn(){
  return mkBtn('🔄 새로 뽑기','mini',()=>{
    if(rolling) return;
    const own=S.mode==='one'||S.mode==='many';   /* 한 명·여러 명은 「오늘 뽑힌 친구」 기록을 같이 쓴다 */
    if(own && Object.keys(S.done).length
       && !confirm('오늘 뽑힌 기록을 지우고 처음부터 다시 뽑을까요?\n(명단·결석은 그대로예요)')) return;
    if(own){ S.done={}; save(); }
    drawBoard(); drawPool();
  });
}
function mkBtn(txt,cls,fn){ const b=el('button','btn'+(cls?' '+cls:''),txt); b.onclick=fn; return b; }
function counter(label,get,set,min,max){
  const wrap=el('div','numrow');
  wrap.appendChild(el('span','',label));
  const n=el('div','num');
  const minus=el('button','','−'), val=el('b','',String(get())), plus=el('button','','＋');
  minus.onclick=()=>{ set(Math.max(min,get()-1)); val.textContent=get(); save(); };
  plus.onclick =()=>{ set(Math.min(max,get()+1)); val.textContent=get(); save(); };
  n.append(minus,val,plus); wrap.appendChild(n);
  return wrap;
}

/* 1) 한 명 뽑기 */
function boardOne(box,list){
  const left=S.noRepeat? list.filter(n=>!S.done[n]) : list;
  box.appendChild(el('div','mascot','🥁'));
  const big=el('div','bigname','누구를 뽑을까?'); box.appendChild(big);
  box.appendChild(el('div','sayline', S.noRepeat
    ? ('아직 안 뽑은 친구 <b>'+left.length+'명</b> / 모두 '+list.length+'명')
    : ('오늘 온 친구 <b>'+list.length+'명</b>')));
  const go=mkBtn('🎲 뽑기!','primary',()=>rollOne(box,big));
  if(!left.length){ big.textContent='모두 다 뽑았어요! 🎉'; go.disabled=true; }
  ctl(box,[go,freshBtn()]);
  if(Object.keys(S.done).length){
    box.appendChild(el('div','sayline','오늘 뽑힌 친구'));
    const p=el('div','picked');
    Object.keys(S.done).forEach(n=>p.appendChild(el('span','ptag',ani(n)+esc(n))));
    box.appendChild(p);
  }
}
function rollOne(box,big){
  if(rolling) return;
  ac();
  if(dayCheck()){ drawBoard(); return; }                       // 누른 그 순간에 소리를 깨워 둔다(모바일 대응)
  const list=alive();
  const pool=S.noRepeat? list.filter(n=>!S.done[n]) : list;
  if(!pool.length) return;
  const pick=pool[Math.floor(Math.random()*pool.length)];
  rolling=true; rollStep=0; big.classList.add('roll');
  const mascot=box.querySelector('.mascot'); if(mascot) mascot.classList.add('roll');

  const DUR=1600, t0=performance.now(); let last=0, over=false;
  function finish(){
    if(over) return; over=true;
    big.classList.remove('roll'); if(mascot) mascot.classList.remove('roll');
    big.textContent=ani(pick)+pick;
    if(S.noRepeat){ S.done[pick]=1; save(); }
    confetti(); sfxWin(); rolling=false;
    setTimeout(()=>spotlight([pick]),250);
    const s=box.querySelector('.sayline');
    if(s && S.noRepeat){
      const left=alive().filter(n=>!S.done[n]).length;
      s.innerHTML='아직 안 뽑은 친구 <b>'+left+'명</b> / 모두 '+alive().length+'명';
    }
    setTimeout(drawPool,300);
  }
  function frame(now){
    if(over) return;
    const p=Math.min(1,(now-t0)/DUR);
    const gap=50+300*p*p;                       // 갈수록 천천히 두구두구
    if(now-last>=gap){ last=now; big.textContent=ani(list[Math.floor(Math.random()*list.length)])+'…'; sfxRoll(p); }
    if(p<1) requestAnimationFrame(frame); else finish();
  }
  requestAnimationFrame(frame);
  setTimeout(finish,DUR+500);   // 화면이 뒤에 있어 애니메이션이 멈춰도 결과는 나오게
}

/* 2) 여러 명 뽑기 */
function boardMany(box,list){
  const left=S.noRepeat? list.filter(n=>!S.done[n]) : list;
  box.appendChild(el('div','mascot','🎁'));
  const res=el('div','picked'); const big=el('div','bigname','몇 명 뽑을까?');
  box.appendChild(big);
  box.appendChild(el('div','sayline', S.noRepeat
    ? ('아직 안 뽑은 친구 <b>'+left.length+'명</b> / 모두 '+list.length+'명')
    : ('오늘 온 친구 <b>'+list.length+'명</b>')));
  box.appendChild(counter('뽑을 사람', ()=>S.pickN, v=>S.pickN=v, 1, Math.max(1,list.length)));
  const go=mkBtn('🎲 뽑기!','primary',()=>{
      if(rolling) return;
      ac();
      if(dayCheck()){ drawBoard(); return; }
      const pool=S.noRepeat? alive().filter(n=>!S.done[n]) : alive();
      if(!pool.length) return;
      const n=Math.min(S.pickN,pool.length);
      const out=shuffle(pool.slice()).slice(0,n);
      if(S.noRepeat){ out.forEach(nm=>S.done[nm]=1); save(); }
      rolling=true;
      big.textContent= n<S.pickN ? `남은 ${n}명을 모두 뽑았어요!` : n+'명 뽑았어요!';
      res.innerHTML=''; out.forEach((nm,i)=>setTimeout(()=>{
        res.appendChild(el('span','ptag',ani(nm)+esc(nm))); sfxPop(i);
        if(i===out.length-1){ confetti(); sfxWin(); rolling=false; setTimeout(()=>{ spotlight(out); drawPool(); },350); }
      }, i*220));
    });
  if(!left.length){ big.textContent='모두 한 번씩 뽑혔어요! 🎉'; go.disabled=true; }
  ctl(box,[ go,
    mkBtn('📋 복사','mini',()=>copy(Array.from(res.children).map(c=>c.textContent).join('\n'))),
    freshBtn()
  ]);
  box.appendChild(res);
  const before=Object.keys(S.done);
  if(S.noRepeat && before.length){
    box.appendChild(el('div','sayline','오늘 뽑힌 친구'));
    const p=el('div','picked'); p.style.opacity='.75';
    before.forEach(n=>p.appendChild(el('span','ptag',ani(n)+esc(n))));
    box.appendChild(p);
  }
}

/* 3) 짝 만들기 */
function boardPair(box,list){
  box.appendChild(el('div','mascot','👫'));
  const big=el('div','bigname','짝을 만들어 볼까?'); const wrap=el('div','cards');
  box.appendChild(big);

  // 홀수일 때 어떻게 할지
  const odd=el('div','numrow');
  odd.appendChild(el('span','','사람이 홀수면?'));
  const bTrio=mkBtn('마지막 팀 3명','mini'+(S.oddMode==='trio'?' pink':''),()=>{ S.oddMode='trio'; save(); drawBoard(); });
  const bSolo=mkBtn('한 명은 혼자','mini'+(S.oddMode==='solo'?' pink':''),()=>{ S.oddMode='solo'; save(); drawBoard(); });
  odd.append(bTrio,bSolo); box.appendChild(odd);

  ctl(box,[ mkBtn('🎲 짝 만들기','primary',()=>{
      ac();
      if(list.length<2){ big.textContent='두 명 이상 있어야 해요 🙂'; return; }
      const a=shuffle(list.slice()); const pairs=[];
      while(a.length>=2) pairs.push([a.pop(),a.pop()]);
      if(a.length){                                  // 홀수 한 명 남았을 때
        if(S.oddMode==='solo' || !pairs.length) pairs.push([a.pop()]);
        else pairs[pairs.length-1].push(a.pop());
      }
      const solo=pairs.filter(p=>p.length===1).length;
      const trio=pairs.filter(p=>p.length===3).length;
      big.textContent='짝꿍 '+(pairs.length-solo)+'팀'+(trio?' (한 팀은 3명)':'')+'!';
      wrap.innerHTML='';
      pairs.forEach((p,i)=>setTimeout(()=>{
        const line=p.length===1
          ? (S.animal?ani(p[0]):'⭐ ')+esc(p[0])
          : p.map(n=>ani(n)+esc(n)).join(' <span style="color:var(--pink)">♥</span> ');
        const e=el('div','pairline',line);
        if(p.length===1) e.style.borderColor='var(--sun)';
        wrap.appendChild(e); sfxPop(i);
        if(i===pairs.length-1){ confetti(); sfxWin(); }
      }, i*160));
    }),
    mkBtn('📋 복사','mini',()=>copy(Array.from(wrap.children).map(c=>c.textContent).join('\n'))),
    mkBtn('🖨 인쇄','mini',()=>window.print()),
    freshBtn()
  ]);
  box.appendChild(wrap);
}

  const bSize =mkBtn('한 모둠 인원으로','mini'+(S.groupBy==='size'?' pink':''),()=>{ S.groupBy='size'; save(); drawBoard(); });
  modeRow.append(bCount,bSize); box.appendChild(modeRow);
  box.appendChild(counter(S.groupBy==='count'?'모둠 수':'한 모둠 인원', ()=>S.groupN, v=>S.groupN=v, 2, 10));
  ctl(box,[ mkBtn('🎲 모둠 나누기','primary',()=>{
      ac();
      if(list.length<2){ big.textContent='두 명 이상 있어야 해요 🙂'; return; }
      const a=shuffle(list.slice());

      const gs=Array.from({length:k},()=>[]);
      a.forEach((n,i)=>gs[i%k].push(n));
      big.textContent=k+'모둠으로 나눴어요!';
      wrap.innerHTML='';
      gs.forEach((g,i)=>setTimeout(()=>{
        wrap.appendChild(el('div','gcard c'+(i%6),
          '<h4>'+GROUPICON[i%GROUPICON.length]+' '+(i+1)+'모둠 <span style="color:var(--sub);font-size:.8em">'+g.length+'명</span></h4>'
          +'<ul>'+g.map(n=>'<li>'+ani(n)+esc(n)+'</li>').join('')+'</ul>'));
        sfxPop(i);
        if(i===gs.length-1){ confetti(); sfxWin(); }
      }, i*170));
    }),
    mkBtn('📋 복사','mini',()=>copy(Array.from(wrap.children).map(c=>c.textContent.replace(/\s+/g,' ')).join('\n'))),
    mkBtn('🖨 인쇄','mini',()=>window.print()),
    freshBtn()
  ]);
  box.appendChild(wrap);
}

    mkBtn('📋 복사','mini',()=>copy(Array.from(wrap.children).map((c,i)=>(i+1)+'. '+c.textContent.replace(/^\d+/,'')).join('\n'))),
    mkBtn('🖨 인쇄','mini',()=>window.print()),
    freshBtn()
  ]);
  box.appendChild(wrap);
}

/* 6) 모둠 뽑기 */
function boardGpick(box){
  box.appendChild(el('div','mascot','🍀'));
  const big=el('div','bigname','어느 모둠일까?'); box.appendChild(big);
  const grid=el('div','gpgrid');
  const left=()=>Array.from({length:S.gpN},(_,i)=>i+1).filter(k=>!(S.gpNoRep&&S.gpDone[k]));
  const say=el('div','sayline');
  function cards(){
    grid.innerHTML='';
    for(let k=1;k<=S.gpN;k++){
      const c=el('div','gpc c'+((k-1)%6)+(S.gpNoRep&&S.gpDone[k]?' done':''),
        '<span class="ic">'+GROUPICON[(k-1)%GROUPICON.length]+'</span><b>'+k+'모둠</b>'+(S.gpDone[k]?'<i>✔ 뽑힘</i>':''));
      c.dataset.k=k; grid.appendChild(c);
    }
    say.innerHTML= S.gpNoRep? '아직 안 뽑힌 모둠 <b>'+left().length+'개</b> / 모두 '+S.gpN+'개' : '모둠 <b>'+S.gpN+'개</b> 중에서 뽑아요';
  }
  const cnt=counter('모둠 수', ()=>S.gpN, v=>{ S.gpN=v; Object.keys(S.gpDone).forEach(k=>{ if(+k>v) delete S.gpDone[k]; }); cards(); }, 2, 10);
  box.appendChild(cnt);
  const tg=mkBtn((S.gpNoRep?'✅':'⬜')+' 오늘 뽑힌 모둠은 빼고 뽑기','mini',()=>{ S.gpNoRep=!S.gpNoRep; save(); drawBoard(); });
  box.appendChild(tg);
  const go=mkBtn('🎲 모둠 뽑기!','primary',()=>rollG());
  const fresh=mkBtn('🔄 새로 뽑기','mini',()=>{ if(rolling)return; S.gpDone={}; save(); big.textContent='어느 모둠일까?'; cards(); go.disabled=false; });
  ctl(box,[go,fresh]);
  box.appendChild(grid); box.appendChild(say);
  cards();
  if(!left().length){ big.textContent='모든 모둠이 다 뽑혔어요! 🎉'; go.disabled=true; }
  function rollG(){
    if(rolling) return; ac();
    if(dayCheck()){ drawBoard(); return; }
    const pool=left(); if(!pool.length) return;
    const pick=pool[Math.floor(Math.random()*pool.length)];
    rolling=true; big.classList.add('roll');
    const mascot=box.querySelector('.mascot'); if(mascot) mascot.classList.add('roll');
    const els=[...grid.querySelectorAll('.gpc')].filter(c=>pool.includes(+c.dataset.k));
    // 차례로 번쩍이다 점점 느려져 pick 에 멈춤
    let steps=[], i=Math.floor(Math.random()*els.length), t=0, gap=60;
    const target=els.findIndex(c=>+c.dataset.k===pick);
    while(t<2600 || i%els.length!==target){ steps.push({t,i:i%els.length}); i++; t+=gap; gap=Math.min(520,gap*(t<1400?1.05:1.13)); if(steps.length>400)break; }
    steps.push({t,i:target});
    const t0=performance.now(); let si=0, over=false;
    function lit(j){ els.forEach((c,k)=>c.classList.toggle('lit',k===j)); }
    function finish(){
      if(over)return; over=true; lit(target);
      const c=els[target]; c.classList.add('win');
      big.classList.remove('roll'); if(mascot) mascot.classList.remove('roll');
      big.textContent=GROUPICON[(pick-1)%GROUPICON.length]+' '+pick+'모둠!';
      S.gpDone[pick]=1; save(); confetti(); sfxWin(); rolling=false;
      setTimeout(()=>{ spotlight([GROUPICON[(pick-1)%GROUPICON.length]+' '+pick+'모둠'],{raw:true,cap:['🍀 뽑힌 모둠은?!','✨ 오늘의 주인공 모둠 ✨','두구두구… 바로 이 모둠!'][Math.floor(Math.random()*3)],msg:['모둠 친구들 다 함께 일어나요! 🙌','멋지게 해 보자, 파이팅! 💪','모두 박수 짝짝짝! 👏'][Math.floor(Math.random()*3)]}); },500);
      setTimeout(()=>{ cards(); if(!left().length){ go.disabled=true; } },900);
    }
    function frame(now){
      if(over)return;
      const e=now-t0;
      while(si<steps.length && steps[si].t<=e){ lit(steps[si].i); sfxRoll(Math.min(1,steps[si].t/steps[steps.length-1].t)); si++; }
      if(si>=steps.length) finish(); else requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    setTimeout(finish,steps[steps.length-1].t+700);
  }
}

/* 7) 사다리 타기 */
const LADCOL=['#ff6b9a','#4dabf7','#51cf66','#ffa94d','#9775fa','#20c997','#f06595','#fab005','#339af0','#ff8787','#5c7cfa','#94d82d'];
const LADP_TOP=()=>[
  ['🧩 모둠',Array.from({length:S.gpN||6},(_,i)=>(i+1)+'모둠').join(', ')],
  ['🔢 번호 1~6','1번, 2번, 3번, 4번, 5번, 6번'],
  ['🙋 오늘 온 친구',alive().length<=12? alive().join(', ') : null]
];
const LADP_BOT=n=>[
  ['🎁 당첨 1개',['🎁 당첨'].concat(Array(Math.max(0,n-1)).fill('꽝')).join(', ')],
  ['🎁 당첨 2개',['🎁 당첨','🎁 당첨'].concat(Array(Math.max(0,n-2)).fill('꽝')).join(', ')],
  ['🥇 순서',Array.from({length:n},(_,i)=>(i+1)+'번째').join(', ')],
  ['🧹 역할',['발표','기록','정리','준비물','칭찬 대장','시간 지킴이','응원 단장','질문 왕','청소 반장','심부름','사진 담당','이끔이'].slice(0,n).join(', ')]
];
let LAD=null;
function splitL(t){ return String(t||'').split(/[,，\n]+/).map(x=>x.trim()).filter(Boolean); }
function boardLadder(box,list){
  box.appendChild(el('div','mascot','🪜'));
  const big=el('div','bigname','두근두근 사다리 타기'); box.appendChild(big);
  if(!S.ladTop) S.ladTop=LADP_TOP()[0][1];
  if(!S.ladBot) S.ladBot=LADP_BOT(splitL(S.ladTop).length)[0][1];
  const form=el('div','ladform');
  form.innerHTML='<div class="lf"><span class="lt">⬆ 위 (누가)</span><input id="ladTop"><div class="lp" id="ladTopP"></div></div>'
    +'<div class="lf"><span class="lt">⬇ 아래 (무엇)</span><input id="ladBot"><div class="lp" id="ladBotP"></div></div>'
    +'<div class="sayline">쉼표(,)로 나눠 적어요 · 2~12칸 · 아래 칸이 모자라면 「꽝」으로 채워요</div>';
  box.appendChild(form);
  const iT=form.querySelector('#ladTop'), iB=form.querySelector('#ladBot');
  iT.value=S.ladTop; iB.value=S.ladBot;
  iT.oninput=()=>{ S.ladTop=iT.value; save(); presets(); };
  iB.oninput=()=>{ S.ladBot=iB.value; save(); };
  function presets(){
    const pt=form.querySelector('#ladTopP'); pt.innerHTML='';
    LADP_TOP().forEach(([t,v])=>{ const b=mkBtn(t,'mini',()=>{ iT.value=S.ladTop=v; save(); presets(); }); if(!v){ b.disabled=true; b.title='12명 이하일 때만'; } pt.appendChild(b); });
    const pb=form.querySelector('#ladBotP'); pb.innerHTML='';
    const n=Math.max(2,Math.min(12,splitL(iT.value).length));
    LADP_BOT(n).forEach(([t,v])=>pb.appendChild(mkBtn(t,'mini',()=>{ iB.value=S.ladBot=v; save(); })));
  }
  presets();
  const area=el('div','ladarea'); 
  const bMake=mkBtn('🪜 사다리 만들기!','primary',()=>{ if(rolling)return; ac(); make(); });
  const bAll=mkBtn('🎬 하나씩 모두 공개','pink',()=>revealAll()); bAll.disabled=true;
  const bMix=mkBtn('🔀 다시 섞기','mini',()=>{ if(rolling)return; make(); }); bMix.disabled=true;
  const bEdit=mkBtn('✏️ 칸 고치기','mini',()=>{ if(rolling)return; form.style.display=form.style.display==='none'?'':'none'; }); bEdit.style.display='none';
  ctl(box,[bMake,bAll,bMix,bEdit]);
  box.appendChild(area);
  function make(){
    let top=splitL(S.ladTop).slice(0,12), bot=splitL(S.ladBot);
    if(top.length<2){ big.textContent='위 칸을 2개 이상 적어 주세요 🙂'; return; }
    const n=top.length;
    if(bot.length<n) bot=bot.concat(Array(n-bot.length).fill('꽝'));
    bot=shuffle(bot.slice(0,n));
    const R=n<=4?9:n<=8?11:13, rungs=[];
    for(let r=0;r<R;r++){ const row=[]; for(let c=0;c<n-1;c++){ row.push(!row[c-1] && Math.random()<.42); } rungs.push(row); }
    for(let c=0;c<n-1;c++){ // 칸마다 가로줄 최소 2개
      let k=rungs.filter(r=>r[c]).length;
      for(let r=0;k<2&&r<R*3;r++){ const rr=Math.floor(Math.random()*R); const row=rungs[rr]; if(!row[c] && !row[c-1] && !row[c+1]){ row[c]=true; k++; } }
    }
    LAD={n,R,top,bot,rungs,done:{}};
    big.textContent='누구부터 내려가 볼까? 이름을 눌러요!';
    bAll.disabled=false; bMix.disabled=false; form.style.display='none'; bEdit.style.display='';
    drawLad(); sfxPop(0);
  }
  const Y=r=>60+r*(480/(LAD.R-1));
  function path(c){
    const pts=[[c,0]]; let x=c;
    for(let r=0;r<LAD.R;r++){
      const y=Y(r);
      if(LAD.rungs[r][x]){ pts.push([x,y]); x++; pts.push([x,y]); }
      else if(x>0 && LAD.rungs[r][x-1]){ pts.push([x,y]); x--; pts.push([x,y]); }
    }
    pts.push([x,600]); return {pts,end:x};
  }
  function drawLad(){
    const {n,R,top,bot,rungs}=LAD, W=n*100;
    let svg='<svg class="ladsvg" viewBox="0 0 '+W+' 600" preserveAspectRatio="none">';
    for(let c=0;c<n;c++) svg+='<line x1="'+(c*100+50)+'" y1="0" x2="'+(c*100+50)+'" y2="600" class="lv"/>';
    for(let r=0;r<R;r++) for(let c=0;c<n-1;c++) if(rungs[r][c]) svg+='<line x1="'+(c*100+50)+'" y1="'+Y(r)+'" x2="'+(c*100+150)+'" y2="'+Y(r)+'" class="lr"/>';
    svg+='<g id="trails"></g></svg>';
    area.style.setProperty('--n',n);
    area.innerHTML='<div class="lrow top">'+top.map((t,c)=>'<button class="ltop" data-c="'+c+'" style="--lc:'+LADCOL[c%12]+'"><span class="la">'+(S.animal&&names().includes(t)?ani(t):'')+'</span>'+esc(t)+'</button>').join('')+'</div>'
      +'<div class="lmid">'+svg+'<div class="lball" id="lball"></div></div>'
      +'<div class="lrow bot">'+bot.map((t,c)=>'<div class="lbot" data-c="'+c+'"><span class="q">?</span><span class="r">'+esc(t)+'</span></div>').join('')+'</div>';
    area.querySelectorAll('.ltop').forEach(b=>b.onclick=()=>trace(+b.dataset.c,true));
  }
  function trace(c,single){
    return new Promise(done=>{
      if(rolling || !LAD || LAD.done[c]){ done(); return; }
      ac(); rolling=true; LAD.done[c]=1;
      const {pts,end}=path(c), col=LADCOL[c%12], W=LAD.n*100;
      const P=pts.map(([x,y])=>[x*100+50,y]);
      const seg=[]; let L=0; for(let k=1;k<P.length;k++){ const d=Math.hypot(P[k][0]-P[k-1][0],(P[k][1]-P[k-1][1])); seg.push(d); L+=d; }
      const g=area.querySelector('#trails');
      const pl=document.createElementNS('http://www.w3.org/2000/svg','polyline'); pl.setAttribute('class','lt'); pl.style.stroke=col; g.appendChild(pl);
      const ball=area.querySelector('#lball'); ball.style.background=col; ball.classList.add('on');
      const topB=area.querySelector('.ltop[data-c="'+c+'"]'); topB.classList.add('go');
      area.classList.add('tracing');
      const fast=single?1:1.6, slowAt=.78;
      const T1=2600/fast, T2=1900/fast; // 앞 78%는 빠르게, 마지막은 천천히(두근두근)
      const t0=performance.now(); let lastTurn=0, beat=0;
      function posAt(d){ let acc=0; const out=[P[0]]; for(let k=0;k<seg.length;k++){ if(acc+seg[k]>=d){ const f=(d-acc)/seg[k]; out.push([P[k][0]+(P[k+1][0]-P[k][0])*f,P[k][1]+(P[k+1][1]-P[k][1])*f]); return {pts:out,k}; } acc+=seg[k]; out.push(P[k+1]); } return {pts:out,k:seg.length}; }
      function frame(now){
        const e=now-t0; let d;
        if(e<T1) d=L*slowAt*(e/T1); else d=L*(slowAt+(1-slowAt)*Math.min(1,(e-T1)/T2));
        const {pts:q,k}=posAt(d); const cur=q[q.length-1];
        pl.setAttribute('points',q.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '));
        ball.style.left=(cur[0]/W*100)+'%'; ball.style.top=(cur[1]/600*100)+'%';
        if(k>lastTurn){ lastTurn=k; if(P[k] && P[k-1] && P[k][1]===P[k-1][1]) {} else drumTap(.5); tone(600+k*25,.05,'square',.08); }
        if(e>T1 && e-beat>(e<T1+T2*.6?420:260)){ beat=e; tone(70,.18,'sine',.5); tone(55,.2,'sine',.4,.12); }
        if(d<L) requestAnimationFrame(frame); else fin();
      }
      let over=false;
      function fin(){
        if(over) return; over=true;
        pl.setAttribute('points',P.map(p=>p[0]+','+p[1]).join(' '));
        ball.classList.remove('on'); area.classList.remove('tracing'); topB.classList.remove('go'); topB.classList.add('did');
        const b=area.querySelector('.lbot[data-c="'+end+'"]'); b.classList.add('open'); b.style.setProperty('--lc',col);
        const res=LAD.bot[end], lose=/꽝/.test(res);
        b.classList.toggle('lose',lose);
        topB.insertAdjacentHTML('beforeend','<small>→ '+esc(res)+'</small>');
        if(lose){ tone(392,.18,'sawtooth',.18,0,196); tone(196,.3,'triangle',.2,.18,110); big.textContent=LAD.top[c]+' → '+res+' 😝'; }
        else { confetti(); sfxWin(); big.textContent=LAD.top[c]+' → '+res+'!'; }
        rolling=false;
        if(single && !lose) setTimeout(()=>spotlight([LAD.top[c]],{raw:!names().includes(LAD.top[c]),cap:'🪜 '+res+'!',msg:'사다리가 골라 줬어요! 🎉'}),700);
        if(Object.keys(LAD.done).length===LAD.n) bAll.disabled=true;
        setTimeout(done,single?0:900);
      }
      requestAnimationFrame(frame);
      setTimeout(fin,T1+T2+800);
    });
  }
  async function revealAll(){
    if(rolling||!LAD) return; bAll.disabled=true; bMix.disabled=true; bMake.disabled=true;
    for(let c=0;c<LAD.n;c++){ if(!LAD.done[c]) await trace(c,false); }
    bMix.disabled=false; bMake.disabled=false;
    big.textContent='사다리 결과가 모두 나왔어요! 🎉'; sfxWin();
  }
  if(LAD && LAD.top.join()===splitL(S.ladTop).slice(0,12).join()){ LAD.done={}; drawLad(); form.style.display='none'; bEdit.style.display=''; bAll.disabled=false; bMix.disabled=false; big.textContent='누구부터 내려가 볼까? 이름을 눌러요!'; }
}

/* ── 색종이 ── */
function confetti(){
  const box=$('#conf'); if(!box) return;
  const cols=['#ff8fb1','#ffc861','#5ecfb0','#8b6fd6','#6fc3f0','#ff9f68'];
  for(let i=0;i<36;i++){
    const p=document.createElement('i');
    p.style.left=Math.random()*100+'%';
    p.style.background=cols[i%cols.length];
    p.style.animationDuration=(1.1+Math.random()*1.1)+'s';
    p.style.animationDelay=(Math.random()*.35)+'s';
    box.appendChild(p);
    setTimeout(()=>p.remove(),2600);
  }
}
async function copy(t){
  if(!t.trim()){ alert('먼저 뽑아 주세요 🙂'); return; }
  try{ await navigator.clipboard.writeText(t); alert('복사했어요! 📋'); }
  catch(e){ alert('복사가 안 돼요 😢 화면을 길게 눌러 복사해 주세요.'); }
}

/* ── 명단 ── */
function drawPool(){
  const box=$('#pool'); const list=names();
  if(!list.length){ box.innerHTML=''; return; }

  box.innerHTML='<h3>우리 반 <span style="color:var(--grape-d)">'+(list.length-offN)+'명</span>'
    +(offN?' <span style="color:var(--sub);font-size:.85em">· 오늘 빠짐 '+offN+'명</span>':'')+'</h3>'
    +'<p class="hint">🙋 <b>결석한 친구는 이름을 눌러 빼 두세요</b> (회색 줄 = 오늘 빠짐). 분홍 테두리 = <b>오늘 이미 뽑힌 친구</b>. 내일이 되면 둘 다 저절로 지워져요.</p>'
    +'<div class="chips" id="chips"></div>';
  const chips=$('#chips');
  list.forEach(n=>{
    const b=document.createElement('button');
    b.className='chip'+(S.off[n]?' off':'')+(S.done[n]?' done':'');

}

$('#btnSound').onclick=()=>{

  if(!confirm('정말 모두 지울까요?\n명단과 뽑은 기록이 사라져요.')) return;
  S=normalize({}); save(); drawSound(); $('#mSet').classList.remove('on'); drawTabs(); drawBoard(); drawPool();
};
$('#mSet').addEventListener('click',e=>{ if(e.target===$('#mSet')) $('#btnCancel').click(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('#mSet').classList.remove('on'); });

$('#spot').onclick=closeSpot;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSpot(); });
if(S.day && load().day!==S.day) save();
drawTabs(); drawBoard(); drawPool();
if(!names().length) $('#btnSet').click();
